<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>B站字幕提取助手</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="../shared/promo.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <script>if (new URLSearchParams(location.search).has('panel')) document.documentElement.classList.add('is-panel');</script>
  <div class="wrap">
    <div id="home" class="home">
    <header class="hero">
      <div class="brand-row">
        <img class="brand-icon" src="../../public/icons/icon32.png" alt="" />
        <div>
          <div class="brand">字幕提取助手 <span class="version">v1.0</span></div>
          <p>把已有字幕变成可搜索、可导出的学习资料</p>
        </div>
      </div>
    </header>

    <div class="flow" aria-label="使用步骤">
      <span><b>1</b>识别</span><i></i>
      <span><b>2</b>提取</span><i></i>
      <span><b>3</b>整理导出</span>
    </div>

    <section id="state-card" class="card">
      <div class="state-row">
        <span id="state-dot" class="dot pulse"></span>
        <div>
          <strong id="state-title">正在识别当前页面…</strong>
          <p id="state-desc">打开 B站视频页后，我会检测可用字幕轨道。</p>
        </div>
      </div>
    </section>

    <section id="video-card" class="card hidden">
      <div class="video-meta">
        <div id="video-title" class="video-title"></div>
        <div id="video-sub" class="video-sub"></div>
      </div>
      <label id="track-field" class="field" for="track-select">
        <span>字幕轨道</span>
        <select id="track-select"></select>
        <p id="track-empty" class="track-empty hidden">这个视频没有可提取的字幕轨道</p>
      </label>
    </section>

    <label class="check merge-row" for="merge-short">
      <input id="merge-short" type="checkbox" checked />
      <span class="box">✓</span>
      <span>合并过短的相邻字幕</span>
    </label>

    <div id="extract-actions" class="actions">
      <button id="btn-options" type="button">设置</button>
      <button id="btn-extract" class="primary" type="button" disabled>提取字幕 <span>→</span></button>
    </div>
    <button id="btn-retry" class="ghost hidden" type="button">重试</button>
    <button id="btn-workspace" class="ghost hidden" type="button">打开字幕工作台</button>
    <div id="status" class="status" role="status"></div>
    <div id="debug-box" class="debug-box hidden">
      <div class="debug-bar">
        <span>调试日志</span>
        <span id="debug-count">0</span>
        <button id="debug-copy" type="button">复制</button>
        <button id="debug-clear" type="button">清空</button>
      </div>
      <pre id="debug-log">暂无日志</pre>
    </div>
    <footer class="promo-footer">
      <div id="promo-stats" class="promo-stats hidden"></div>
      <div class="promo-links">
        <a id="link-faq" class="promo-link" href="#" target="_blank" rel="noopener noreferrer">常见问题</a>
        <a id="link-privacy" class="promo-link" href="#" target="_blank" rel="noopener noreferrer">隐私政策</a>
        <button type="button" class="promo-link" data-sheet="notice">公告</button>
        <button type="button" class="promo-link" data-sheet="coop">开发合作</button>
        <a id="link-feedback" class="promo-feedback" href="mailto:hangdudu0@agent.qq.com?subject=B站字幕提取助手反馈">反馈邮箱：hangdudu0@agent.qq.com</a>
      </div>
    </footer>
    </div>
    <div id="page" class="promo-page hidden">
      <button id="page-back" class="promo-page-back" type="button">返回提取</button>
      <h3 id="info-title" class="promo-page-title"></h3>
      <p id="info-date" class="promo-info-date hidden"></p>
      <div id="info-body" class="promo-info-body"></div>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
