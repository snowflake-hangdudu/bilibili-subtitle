<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设置 · B站字幕提取助手</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="options.css" />
</head>
<body data-theme="bilibili">
  <main class="page">
    <header>
      <img src="../../icons/icon48.png?v=2" alt="" />
      <div>
        <h1>设置</h1>
        <p>这些选项只保存在本机浏览器，不会上传。</p>
      </div>
    </header>

    <section class="card">
      <h2>导出偏好</h2>
      <label class="field">
        <span>默认格式</span>
        <select id="format">
          <option value="txt">TXT</option>
          <option value="markdown">Markdown</option>
          <option value="srt">SRT</option>
        </select>
      </label>
      <label class="check"><input id="include-ts" type="checkbox" /> 默认带时间轴（SRT 始终包含时间）</label>
      <label class="field">
        <span>时间显示</span>
        <select id="ts-format">
          <option value="clock">自动（短视频用 mm:ss）</option>
          <option value="full">始终 HH:MM:SS</option>
        </select>
      </label>
      <label class="check"><input id="merge-short" type="checkbox" /> 合并过短的相邻字幕</label>
      <label class="field">
        <span>文件名模板</span>
        <input id="filename" type="text" spellcheck="false" />
        <small>可用变量：{title} {part} {lang} {bvid} {owner}</small>
      </label>
      <button id="save" class="primary" type="button">保存设置</button>
      <button id="clear" type="button">清理本地数据</button>
      <div id="status" class="status"></div>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
