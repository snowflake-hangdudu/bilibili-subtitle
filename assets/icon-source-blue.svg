<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="B站字幕提取助手">
  <defs>
    <linearGradient id="bg" x1="72" y1="40" x2="440" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35CCFF"/>
      <stop offset="1" stop-color="#0074DA"/>
    </linearGradient>
    <linearGradient id="play" x1="196" y1="168" x2="316" y2="288" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35CCFF"/>
      <stop offset="1" stop-color="#0074DA"/>
    </linearGradient>
    <linearGradient id="white" x1="256" y1="108" x2="256" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F4FF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- long shadow -->
  <path d="M148 332 L396 332 L396 368 L300 368 L300 396 L148 396 Z" fill="#005A9E" opacity="0.22" transform="translate(18 18)"/>
  <path d="M118 108 L394 108 L394 296 L118 296 Z" fill="#005A9E" opacity="0.22" transform="translate(18 18)"/>
  <!-- TV body -->
  <rect x="118" y="108" width="276" height="188" rx="28" fill="url(#white)"/>
  <!-- antennas -->
  <rect x="168" y="88" width="10" height="28" rx="5" fill="#FFFFFF" transform="rotate(-28 173 102)"/>
  <rect x="334" y="88" width="10" height="28" rx="5" fill="#FFFFFF" transform="rotate(28 339 102)"/>
  <!-- play -->
  <path d="M214 168 L214 248 L304 208 Z" fill="url(#play)"/>
  <!-- subtitle bars -->
  <rect x="148" y="326" width="216" height="26" rx="13" fill="url(#white)"/>
  <rect x="148" y="364" width="152" height="26" rx="13" fill="url(#white)"/>
</svg>
